# Fronts the enclave's HTTPS port on the parent host. Enclaver's ingress forwards raw TCP and
# drops the client's address, so HAProxy adds it as a PROXY protocol header, which Caddy inside
# the enclave requires. TLS still ends inside the enclave: HAProxy only sees encrypted bytes.
# host.sh publishes the enclave's port 443 on 127.0.0.1:8443 only, so nothing outside the host
# can reach Caddy without going through HAProxy and claim another address.
global
    user haproxy
    group haproxy
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    # Idle limits, not request limits: a streamed model response can pause between chunks.
    timeout client 10m
    timeout server 10m

frontend gateway_https
    bind :443
    default_backend enclave

backend enclave
    server enclave 127.0.0.1:8443 send-proxy-v2
