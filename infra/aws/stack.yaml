AWSTemplateFormatVersion: '2010-09-09'
Description: Fiducy gateway - one Graviton host running the gateway inside a Nitro enclave. The key it uses lives in key.yaml

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Amazon Linux 2023 arm64 AMI, pinned so stack updates never replace the host
  InstanceType:
    Type: String
    Default: c6g.large
  KeyArn:
    Type: String
    Description: >-
      ARN of the wrapping key, the KeyArn output of the key stack (key.yaml). deploy.sh fills it in
  GitHubRepository:
    Type: String
    Default: fiducy-dev/fiducy
    Description: owner/name of the repository whose aws-production environment may assume the deployer role
  GitHubOIDCProviderArn:
    Type: String
    Default: ''
    Description: >-
      ARN of an existing GitHub OIDC provider in this account. Leave empty to create one; an
      account can only hold one for token.actions.githubusercontent.com
  EnableGitHubDeploy:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Create the GitHub OIDC provider and the deployer role so GitHub Actions can deploy. Set to
      false where IAM identity providers are not allowed; deploy.sh from a machine still works
  KeysTableName:
    Type: String
    Description: >-
      Name of the sealed records table, the KeysTableName output of the key stack. deploy.sh
      fills it in
  AlertTopicArn:
    Type: String
    Default: ''
    Description: >-
      ARN of the alert topic, the AlertTopicArn output of the key stack. The rules below email it
      when someone touches the key, the roles, the host, the table or a stack, or when a Decrypt
      is refused. Empty turns the rules off. deploy.sh fills it in

Conditions:
  GitHubDeploy: !Equals [!Ref EnableGitHubDeploy, 'true']
  CreateGitHubOIDCProvider: !And [!Condition GitHubDeploy, !Equals [!Ref GitHubOIDCProviderArn, '']]
  SendAlerts: !Not [!Equals [!Ref AlertTopicArn, '']]

Resources:
  DeployBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-releases
            Status: Enabled
            ExpirationInDays: 14

  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: fiducy-host
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${DeployBucket.Arn}/*'
              # Decrypt is listed here but the key policy denies it unless the request carries
              # an attestation document from the enclave image and config the key stack
              # (key.yaml) pinned.
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:DescribeKey]
                Resource: !Ref KeyArn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem]
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${KeysTableName}'
              - Effect: Allow
                Action: [ssm:GetParameter]
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fiducy/*'
              # The host publishes the config the enclave reads at boot. A config nobody pinned
              # gives a different PCR16, and the key refuses that enclave.
              - Effect: Allow
                Action: [ssm:PutParameter]
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fiducy/enclave-config'
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]

  # What pin.sh needs from this stack, added to the custodian role the key stack owns. The role's
  # rights over the key live in key.yaml, so a pin never has to read or update anything here.
  KeyCustodianHostAccess:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Sub '${AWS::StackName}-key-custodian'
      PolicyName: fiducy-key-custodian-host
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Sub '${DeployBucket.Arn}/*'
          - Effect: Allow
            Action: ssm:SendCommand
            Resource:
              - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Host}'
              - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
          - Effect: Allow
            Action: [ssm:GetCommandInvocation, ssm:DescribeInstanceInformation]
            Resource: '*'

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # GitHub Actions assumes this role with a short-lived OIDC token from a job in the repository's
  # aws-production environment (required reviewers, main only), so no AWS key is stored anywhere
  # and no other workflow on main can borrow it. It can ship a release and build on the
  # host. It cannot touch the key policy, IAM, or the stack's deletion, and it cannot assume the
  # custodian role (no MFA).
  DeployerRole:
    Type: AWS::IAM::Role
    Condition: GitHubDeploy
    Properties:
      RoleName: !Sub '${AWS::StackName}-deployer'
      Description: Assumed by GitHub Actions from main to upload a release and build it on the host
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Ref GitHubOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:environment:aws-production'
      Policies:
        - PolicyName: fiducy-deployer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeChangeSet
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-key/*'
              - Effect: Allow
                Action: cloudformation:GetTemplateSummary
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${DeployBucket.Arn}/*'
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fiducy/gateway-token'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Host}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:DescribeInstanceInformation]
                Resource: '*'
              - Effect: Deny
                Action:
                  - kms:PutKeyPolicy
                  - kms:ScheduleKeyDeletion
                  - kms:DisableKey
                  - kms:CreateGrant
                  - kms:Decrypt
                  - iam:*
                  - sts:AssumeRole
                  - cloudformation:DeleteStack
                  - ec2:TerminateInstances
                Resource: '*'

  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS for the gateway
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref HostProfile
      SecurityGroupIds: [!GetAtt HostSecurityGroup.GroupId]
      EnclaveOptions:
        Enabled: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        # The enclave reaches IMDS through the Enclaver container, which adds one network hop.
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 30
            Encrypted: true
      Tags:
        - { Key: Name, Value: fiducy-prototype }
        - { Key: fiducy-stack, Value: !Ref AWS::StackName }

  HostAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Host

  # Alerts. Every rule below matches CloudTrail management events and emails the alert topic. The
  # topic, who is subscribed to it and the audit trail live in the key stack (key.yaml), so they
  # outlast this stack and stay under the custodian's lock.
  KeyChangeAlert:
    Type: AWS::Events::Rule
    Condition: SendAlerts
    Properties:
      Name: !Sub '${AWS::StackName}-key-change'
      Description: Someone tried to change what the wrapping key trusts, disable it or delete it
      EventPattern:
        source: [aws.kms]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [PutKeyPolicy, ScheduleKeyDeletion, DisableKey, CreateGrant, UpdateKeyDescription]
          resources:
            ARN: [!Ref KeyArn]
      Targets:
        - Id: email
          Arn: !Ref AlertTopicArn
          InputTransformer:
            InputPathsMap:
              name: $.detail.eventName
              who: $.detail.userIdentity.arn
              time: $.detail.eventTime
              address: $.detail.sourceIPAddress
            InputTemplate: '"Fiducy: <name> on the wrapping key by <who> from <address> at <time>. Only pin.sh run by the custodian should do this."'

  DecryptRefusedAlert:
    Type: AWS::Events::Rule
    Condition: SendAlerts
    Properties:
      Name: !Sub '${AWS::StackName}-decrypt-refused'
      Description: KMS refused a Decrypt with the wrapping key, so something other than the trusted enclave asked
      EventPattern:
        source: [aws.kms]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [Decrypt]
          errorCode: [{ exists: true }]
          resources:
            ARN: [!Ref KeyArn]
      Targets:
        - Id: email
          Arn: !Ref AlertTopicArn
          InputTransformer:
            InputPathsMap:
              who: $.detail.userIdentity.arn
              time: $.detail.eventTime
              error: $.detail.errorCode
            InputTemplate: '"Fiducy: KMS refused a Decrypt from <who> at <time> (<error>). The trusted enclave never gets this. A rogue enclave, the host or an admin tried to open a key."'

  RoleChangeAlert:
    Type: AWS::Events::Rule
    Condition: SendAlerts
    Properties:
      Name: !Sub '${AWS::StackName}-role-change'
      Description: One of the stack's roles was changed (delivered in us-east-1 only, where IAM events land)
      EventPattern:
        source: [aws.iam]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName:
            - CreateRole
            - UpdateAssumeRolePolicy
            - PutRolePolicy
            - DeleteRolePolicy
            - AttachRolePolicy
            - DetachRolePolicy
            - DeleteRole
          requestParameters:
            roleName: !If
              - GitHubDeploy
              - [!Sub '${AWS::StackName}-key-custodian', !Ref DeployerRole, !Ref HostRole]
              - [!Sub '${AWS::StackName}-key-custodian', !Ref HostRole]
      Targets:
        - Id: email
          Arn: !Ref AlertTopicArn
          InputTransformer:
            InputPathsMap:
              name: $.detail.eventName
              who: $.detail.userIdentity.arn
              time: $.detail.eventTime
              role: $.detail.requestParameters.roleName
            InputTemplate: '"Fiducy: <name> on role <role> by <who> at <time>. Only a stack update from an admin should do this."'

  AlertTamperAlert:
    Type: AWS::Events::Rule
    Condition: SendAlerts
    Properties:
      Name: !Sub '${AWS::StackName}-alert-tamper'
      Description: Someone tried to silence these alerts by stopping the trail, the rules or the topic
      EventPattern:
        detail-type: [AWS API Call via CloudTrail]
        source: [aws.cloudtrail, aws.events, aws.sns]
        detail:
          eventName:
            - StopLogging
            - DeleteTrail
            - UpdateTrail
            - PutEventSelectors
            - PutAdvancedEventSelectors
            - DisableRule
            - DeleteRule
            - RemoveTargets
            - PutRule
            - Subscribe
            - Unsubscribe
            - SetSubscriptionAttributes
            - DeleteTopic
            - SetTopicAttributes
      Targets:
        - Id: email
          Arn: !Ref AlertTopicArn
          InputTransformer:
            InputPathsMap:
              name: $.detail.eventName
              who: $.detail.userIdentity.arn
              time: $.detail.eventTime
              address: $.detail.sourceIPAddress
            InputTemplate: '"Fiducy: <name> by <who> from <address> at <time>. This can switch off the alerts that watch the key. If it was not you, treat it as an incident."'

  HostChangeAlert:
    Type: AWS::Events::Rule
    Condition: SendAlerts
    Properties:
      Name: !Sub '${AWS::StackName}-host-change'
      Description: An instance profile was attached or swapped, or the gateway host was changed or terminated
      EventPattern:
        source: [aws.ec2]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName:
            - AssociateIamInstanceProfile
            - ReplaceIamInstanceProfileAssociation
            - ModifyInstanceAttribute
            - TerminateInstances
            - StopInstances
      Targets:
        - Id: email
          Arn: !Ref AlertTopicArn
          InputTransformer:
            InputPathsMap:
              name: $.detail.eventName
              who: $.detail.userIdentity.arn
              time: $.detail.eventTime
              address: $.detail.sourceIPAddress
            InputTemplate: '"Fiducy: <name> by <who> from <address> at <time>. Check it was you."'

  TableChangeAlert:
    Type: AWS::Events::Rule
    Condition: SendAlerts
    Properties:
      Name: !Sub '${AWS::StackName}-table-change'
      Description: The sealed records table was deleted, had its protection changed, or lost its backups
      EventPattern:
        source: [aws.dynamodb]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [DeleteTable, UpdateTable, UpdateContinuousBackups]
          requestParameters:
            tableName: [!Ref KeysTableName]
      Targets:
        - Id: email
          Arn: !Ref AlertTopicArn
          InputTransformer:
            InputPathsMap:
              name: $.detail.eventName
              who: $.detail.userIdentity.arn
              time: $.detail.eventTime
            InputTemplate: '"Fiducy: <name> on the sealed records table by <who> at <time>."'

  StackChangeAlert:
    Type: AWS::Events::Rule
    Condition: SendAlerts
    Properties:
      Name: !Sub '${AWS::StackName}-stack-change'
      Description: The gateway stack or the key stack was updated or deleted
      EventPattern:
        source: [aws.cloudformation]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventName: [ExecuteChangeSet, UpdateStack, DeleteStack]
          requestParameters:
            stackName:
              - !Ref AWS::StackName
              - !Sub '${AWS::StackName}-key'
              - { prefix: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/' }
              - { prefix: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-key/' }
      Targets:
        - Id: email
          Arn: !Ref AlertTopicArn
          InputTransformer:
            InputPathsMap:
              name: $.detail.eventName
              who: $.detail.userIdentity.arn
              time: $.detail.eventTime
            InputTemplate: '"Fiducy: <name> on the gateway or key stack by <who> at <time>. A deploy from CI or a pin by the custodian is expected; anything else is not."'

Outputs:
  InstanceId:
    Value: !Ref Host
  PublicIp:
    Value: !Ref HostAddress
  KeyArn:
    Value: !Ref KeyArn
  BucketName:
    Value: !Ref DeployBucket
  KeysTableName:
    Value: !Ref KeysTableName
  DeployerRoleArn:
    Condition: GitHubDeploy
    Description: Set this as the AWS_DEPLOY_ROLE_ARN repository variable in GitHub
    Value: !GetAtt DeployerRole.Arn
  KeyCustodianRoleArn:
    Description: The role to assume, with MFA, before running pin.sh
    Value: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-key-custodian'
