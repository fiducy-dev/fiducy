AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Fiducy key - what outlives the host: the KMS key that wraps stored API keys, the custodian role
  that decides which enclave it trusts, the table of sealed records, and the alert topic and
  audit trail that watch them. Its own stack, so pin.sh changes nothing but the key policy

Parameters:
  GatewayStackName:
    Type: String
    Description: Name of the gateway stack (stack.yaml) this key serves. Names the custodian role
  EnclaveImageSha384:
    Type: String
    Default: none
    Description: >-
      PCR0 of the enclave image. Only an enclave with this hash can decrypt with the key. Changed
      only by pin.sh, run by the key custodian role with MFA
  EnclaveConfigSha384:
    Type: String
    Default: none
    Description: >-
      PCR16 of the enclave, the measurement of the deployment config it read at boot. Only an
      enclave with this config can decrypt with the key. Changed only by pin.sh
  KeyCustodianUserArns:
    Type: CommaDelimitedList
    Description: >-
      ARNs of the IAM users allowed to assume the key custodian role, each with MFA. Name people,
      not the whole account, so an IAM admin cannot hand themselves the role
  AlertEmail:
    Type: String
    Default: ''
    Description: >-
      Where to send an email when someone touches the key policy, the roles, the host, the table
      or a stack, or when a Decrypt is refused. Empty turns the alerts off
  CreateAuditTrail:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Create a CloudTrail trail so the alert rules receive API calls. Set to false when the account
      already has a trail that records management events

Conditions:
  SendAlerts: !Not [!Equals [!Ref AlertEmail, '']]
  CreateAuditTrail: !And [!Condition SendAlerts, !Equals [!Ref CreateAuditTrail, 'true']]

Resources:
  # Whoever assumes this role decides which enclave image the key trusts. It needs MFA, it is the
  # only principal pin.sh accepts, and the key policy below refuses policy changes from anyone else.
  # The gateway stack adds what pin.sh needs on the host (release bucket, restart).
  KeyCustodianRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${GatewayStackName}-key-custodian'
      Description: Pins the enclave image hash the KMS key trusts. Assume with MFA, run pin.sh
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref KeyCustodianUserArns }
            Action: sts:AssumeRole
            Condition:
              Bool: { aws:MultiFactorAuthPresent: 'true' }
      Policies:
        - PolicyName: fiducy-key-custodian
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeChangeSet
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${GatewayStackName}/*'
              - Effect: Allow
                Action: cloudformation:GetTemplateSummary
                Resource: '*'
              # By ARN pattern and tag, not !GetAtt: the key policy names this role's unique ID,
              # so a reference back to the key would be a circular dependency.
              - Effect: Allow
                Action:
                  - kms:PutKeyPolicy
                  - kms:GetKeyPolicy
                  - kms:DescribeKey
                  - kms:DisableKey
                  - kms:ScheduleKeyDeletion
                  - kms:CancelKeyDeletion
                  - kms:ListResourceTags
                  - kms:GetKeyRotationStatus
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition:
                  StringEquals: { aws:ResourceTag/fiducy-stack: !Ref GatewayStackName }
              # A pin makes CloudFormation read this role's unique ID for the key policy.
              - Effect: Allow
                Action: iam:GetRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${GatewayStackName}-key-custodian'
              # Who is alerted, and retiring the topic with the key. The topic's own policy
              # refuses these from anyone else.
              - !If
                - SendAlerts
                - Effect: Allow
                  Action: [sns:Subscribe, sns:Unsubscribe, sns:ListSubscriptionsByTopic, sns:DeleteTopic]
                  Resource: !Ref AlertTopic
                - !Ref AWS::NoValue

  WrappingKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Wraps share B of every stored API key. Decrypt only works inside the enclave
      PendingWindowInDays: 7
      Tags:
        - { Key: fiducy-stack, Value: !Ref GatewayStackName }
      # The lockout check would refuse this policy, because whoever creates the stack is not the
      # custodian role and so cannot change the policy afterwards. That is the point.
      BypassPolicyLockoutSafetyCheck: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: kms:*
            Resource: '*'
          # Changing what the key trusts, disabling it or scheduling its deletion is reserved for
          # this stack's custodian role (MFA, named users) and the account root user. IAM admins, the deploy credentials
          # and the host cannot, whatever their IAM policies say. Every attempt lands in CloudTrail.
          - Sid: OnlyTheCustodianChangesTheKey
            Effect: Deny
            Principal: '*'
            Action:
              - kms:PutKeyPolicy
              - kms:ScheduleKeyDeletion
              - kms:DisableKey
              - kms:CreateGrant
            Resource: '*'
            # Matched by the role's unique ID, not its name. An admin who deletes the role and
            # creates a new one with the same name gets a new ID, so the new role is refused.
            # The root user's aws:userid is the account ID.
            Condition:
              StringNotLike:
                aws:userid:
                  - !Sub '${KeyCustodianRole.RoleId}:*'
                  - !Ref AWS::AccountId
          # Applies to everyone, account admins included. A Decrypt without an attestation
          # document for this exact enclave image is refused. Missing attestation counts as a
          # mismatch, so the parent host and the AWS console cannot decrypt either.
          - Sid: DecryptOnlyInsideTheEnclave
            Effect: Deny
            Principal: '*'
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              StringNotEqualsIgnoreCase:
                kms:RecipientAttestation:ImageSha384: !Ref EnclaveImageSha384
          # A separate statement, because one Deny with two conditions only applies when both
          # mismatch. The same image with a config nobody pinned (another key, table or control
          # plane) measures a different PCR16 and is refused.
          - Sid: DecryptOnlyWithThePinnedConfig
            Effect: Deny
            Principal: '*'
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              StringNotEqualsIgnoreCase:
                kms:RecipientAttestation:PCR16: !Ref EnclaveConfigSha384
          # ReEncrypt decrypts under this key and re-encrypts under another one, without a Decrypt
          # call. The gateway never uses it, so it is refused for everyone, or a stored share could
          # be moved under a key the caller controls and opened there.
          - Sid: NoReEncrypt
            Effect: Deny
            Principal: '*'
            Action: kms:ReEncrypt*
            Resource: '*'

  # The sealed records. Here, not next to the host, so a rebuilt host finds every stored key again.
  KeysTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: keyID, AttributeType: S }
      KeySchema:
        - { AttributeName: keyID, KeyType: HASH }
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Alerts. The gateway stack's rules match CloudTrail management events, which cost nothing to
  # record once (the trail) and nothing to match (EventBridge), and email this topic. The email is
  # the point: Zeabur learned about its breach from a user, and these are the calls that precede
  # one here. The trail and the topic live here so they outlast a rebuilt host.
  AuditBucket:
    Type: AWS::S3::Bucket
    Condition: CreateAuditTrail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-logs
            Status: Enabled
            ExpirationInDays: 90

  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateAuditTrail
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: NoDeletingAuditLogs
            Effect: Deny
            Principal: '*'
            Action: [s3:DeleteObject, s3:DeleteObjectVersion, s3:PutLifecycleConfiguration]
            Resource: [!GetAtt AuditBucket.Arn, !Sub '${AuditBucket.Arn}/*']
            Condition:
              StringNotLike:
                aws:userid: [!Ref AWS::AccountId]
          - Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${GatewayStackName}-audit'
          - Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${AuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${GatewayStackName}-audit'

  AuditTrail:
    Type: AWS::CloudTrail::Trail
    Condition: CreateAuditTrail
    DependsOn: AuditBucketPolicy
    Properties:
      TrailName: !Sub '${GatewayStackName}-audit'
      S3BucketName: !Ref AuditBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: SendAlerts
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DisplayName: Fiducy gateway alerts
      Subscription:
        - { Protocol: email, Endpoint: !Ref AlertEmail }

  # Kept on delete, like the topic: the policy below refuses changes from everyone but the
  # custodian role and the root user, so a stack delete could not remove either and would fail.
  # The custodian deletes the topic before the key stack is deleted, and the policy goes with it.
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: SendAlerts
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${GatewayStackName}-*'
          # Whoever gets these emails is decided like the key: only the custodian role (MFA) or the
          # root user may change the subscription, the topic or its policy. Anyone else, an IAM admin
          # or a stack update run by the deploy credentials included, is refused, so an attacker
          # cannot quietly point the alerts at themselves before touching the key.
          - Sid: OnlyTheCustodianChangesWhoIsAlerted
            Effect: Deny
            Principal: '*'
            Action:
              - sns:Subscribe
              - sns:SetTopicAttributes
              - sns:AddPermission
              - sns:RemovePermission
              - sns:DeleteTopic
            Resource: !Ref AlertTopic
            Condition:
              StringNotLike:
                aws:userid:
                  - !Sub '${KeyCustodianRole.RoleId}:*'
                  - !Ref AWS::AccountId

Outputs:
  KeyArn:
    Value: !GetAtt WrappingKey.Arn
  KeysTableName:
    Value: !Ref KeysTable
  AlertTopicArn:
    Condition: SendAlerts
    Description: Add or remove alert emails here, as the key custodian
    Value: !Ref AlertTopic
  KeyCustodianRoleArn:
    Description: The role to assume, with MFA, before running pin.sh
    Value: !GetAtt KeyCustodianRole.Arn
