name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: read

jobs:
  # Opens or updates the "Version packages" pull request while changesets are pending, and
  # reports whether package.json holds a version npm does not have yet. It cannot publish.
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      unpublished: ${{ steps.unpublished.outputs.unpublished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version-packages
          commit-message: Version packages
          pr-title: Version packages
      - name: Find versions npm does not have yet
        id: unpublished
        run: |
          unpublished=false
          for manifest in packages/*/package.json; do
            if [ "$(jq -r '.private // false' "$manifest")" = "true" ]; then continue; fi
            spec="$(jq -r '.name + "@" + .version' "$manifest")"
            if ! npm view "$spec" version >/dev/null 2>&1; then
              echo "Not on npm yet: $spec"
              unpublished=true
            fi
          done
          echo "unpublished=$unpublished" >> "$GITHUB_OUTPUT"

  # Publishes only after a maintainer approves the run in the npm-release environment. npm's
  # trusted publisher names that environment, so an upload from any other job is refused.
  publish:
    needs: version
    if: needs.version.outputs.unpublished == 'true'
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun x semver@7.7.3 --range '>=11.5.1' "$(npm --version)"
      - run: bun run release
        env:
          NPM_CONFIG_PROVENANCE: 'true'
      - run: git push origin --tags
