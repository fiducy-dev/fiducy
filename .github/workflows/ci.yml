name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fiducy
          POSTGRES_PASSWORD: fiducy
          POSTGRES_DB: fiducy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fiducy" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: fiducy
          MYSQL_PASSWORD: fiducy
          MYSQL_DATABASE: fiducy_test
          MYSQL_ROOT_PASSWORD: fiducy
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ufiducy -pfiducy" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FIDUCY_TEST_POSTGRES_URL: postgres://fiducy:fiducy@localhost:5432/fiducy_test
      FIDUCY_TEST_MYSQL_URL: mysql://fiducy:fiducy@127.0.0.1:3306/fiducy_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run check:packages
      - run: bunx farm build
        working-directory: apps/site
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium-${{ runner.os }}
      - run: bunx playwright@1.56.1 install chromium
        timeout-minutes: 3
      - run: bun test

  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: bun install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium-${{ runner.os }}
      - run: bunx playwright@1.56.1 install chromium
        timeout-minutes: 3
      - run: bun run test:examples

  caddy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate the enclave Caddyfile with the Caddy version the image ships
        run: >-
          docker run --rm -e FIDUCY_PUBLIC_HOST=gateway.example.com
          -v "$PWD/enclave/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
